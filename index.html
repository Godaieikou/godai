    sortHand(type) {
        const hand = this.engine.players[this.myPlayerId].hand;
        if (type === 'strength') {
            hand.sort((a, b) => this.engine.getCardStrength(a) - this.engine.getCardStrength(b));
        } else if (type === 'suit') {
            const suitOrder = { '♠': 1, '♥': 2, '♦': 3, '♣': 4, 'JK': 5 };
            hand.sort((a, b) => (suitOrder[a.suit] || 5) - (suitOrder[b.suit] || 5) || a.num - b.num);
        }
        this.selectedIndices = [];
        this.updateDisplay();
    }

    showEffectCutin(text, color = 0xffeb3b) {
        const cutin = this.add.container(320, 200).setDepth(300);
        const bg = this.add.rectangle(0, 0, 360, 60, 0x000000, 0.85).setStrokeStyle(3, color);
        const txt = this.add.text(0, 0, text, { fontSize: '22px', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
        cutin.add([bg, txt]);

        this.tweens.add({
            targets: cutin,
            scaleX: { from: 0.5, to: 1.1 },
            scaleY: { from: 0.5, to: 1.1 },
            duration: 250,
            yoyo: true,
            hold: 600,
            onComplete: () => cutin.destroy()
        });
    }

    onPlayerDobon() {
        // ドボンは「ドボン判定フェーズで自分が聞かれているとき」にだけ意味を持つ（O-01。常時押せるボタンではない）
        const q = this.engine.getDobonQuestion();
        if (q && q.playerIndex === this.myPlayerId) {
            this.answerDobonAndContinue(true);
            return;
        }
        if (!this.isHost) {
            // ゲスト：宣言できそうな場面ではホストへ通知し、フェーズ側の検証に委ねる（完全な同期はPeerJS配線の段階で扱う）
            if (this.engine.canDeclareDobon(this.myPlayerId)) {
                this.conn.send({ type: 'ACTION_DOBON', playerIdx: this.myPlayerId });
            }
            return;
        }
    }

    onPlayerPlay() {
        if (this.winRevealCards) return; // あがりの見せ時間中は入力を受けない

        if (this.engine.gameState === 'START_CHOICE') {
            if (this.selectedIndices.length !== 1) {
                this.turnText.setText('親決定用のカードを1枚だけ選択してください').setColor('#ff9800');
                return;
            }

            // N-02：ゲストの操作はインデックスではなくカードIDで送る（選択を消す前に控える）
            const chosenCard = this.engine.players[this.myPlayerId].hand[this.selectedIndices[0]];
            this.engine.selectStartCard(this.myPlayerId, this.selectedIndices[0]);
            this.selectedIndices = [];

            if (this.isHost) {
                // 全員の選択がそろうまで確定しない（ACTION_START_CHOICE ハンドラと同じ条件）。
                // ホストが先に選んだ時点で即 finalize すると、未選択のゲストの startCard が
                // hand[0] で自動補完され、後から届くゲストの選択が破棄されてしまう（順序依存バグ）
                const allSelected = this.engine.players.every(pp => pp.startCard || pp.isCpu);
                if (allSelected) {
                    const starterIdx = this.engine.finalizeStartChoice();
                    this.updateDisplay();
                    this.syncGameState();
                    this.time.delayedCall(this.isFastMode ? 0 : 1000, () => this.checkTurnState());
                }
            } else {
                this.conn.send({ type: 'ACTION_START_CHOICE', playerIdx: this.myPlayerId, cardId: chosenCard ? chosenCard.id : null });
            }
            return;
        }

        const myHand = this.engine.players[this.myPlayerId].hand;
        const selectedCards = this.selectedIndices.map(idx => myHand[idx]);
        const check = this.engine.canPlayCards(selectedCards);

        if (!check.valid) {
            this.turnText.setText(check.reason).setColor('#f44336');
            return;
        }

        // リードで型が曖昧な選択なら、まずトリオ／階段を選ばせる（G-06）
        if (this.isTypeAmbiguousLead(selectedCards)) {
            this.showTypeChoice();
            return;
        }

        // Jが偶数枚なら、最終的な強さ順（上／下）を選ばせる（本人の裁定2026-11-18）
        if (this.needsJBackChoice(selectedCards)) {
            this.showJBackChoice(null);
            return;
        }

        if (this.isHost) {
            this.executePlay(this.myPlayerId, this.selectedIndices);
            this.syncGameState();
        } else {
            // N-02：ゲストの操作は手札のインデックスではなくカードIDで送る
            this.conn.send({ type: 'ACTION_PLAY', playerIdx: this.myPlayerId, cardIds: selectedCards.map(c => c.id) });
        }
        this.selectedIndices = [];
    }

    // リードで型が曖昧な選択か（G-06。本人の裁定2026-11-15：Q1=A・Q2=B・Q3=B）
    // 「実カード1枚＋JKだけ」（枚数不問）または「JKだけ」の組み合わせで、トリオ／階段の両方に読める場合だけ true
    isTypeAmbiguousLead(selectedCards) {
        if (this.engine.fieldCards.length > 0) return false;
        if (selectedCards.length < 2) return false;
        if (selectedCards.filter(c => !c.isJoker).length > 1) return false;
        return !!this.engine.analyzeAsSame(selectedCards) && !!this.engine.analyzeAsSequence(selectedCards);
    }

    showTypeChoice() {
        this.pendingTypeChoice = [...this.selectedIndices];
        this.turnText.setText('どちらの型で出しますか？').setColor('#ffeb3b');
        [this.playBtn, this.passBtn, this.dobonBtn].forEach(b => { b.setVisible(false); this.setButtonEnabled(b, false); });
        [this.typeSameBtn, this.typeSeqBtn].forEach(b => { b.setVisible(true); this.setButtonEnabled(b, true); });
    }

    hideTypeChoiceButtons() {
        [this.typeSameBtn, this.typeSeqBtn].forEach(b => { b.setVisible(false); this.setButtonEnabled(b, false); });
        [this.playBtn, this.passBtn, this.dobonBtn].forEach(b => b.setVisible(true));
    }

    // カードの選択を変えたら型選択は取り消す
    cancelTypeChoice() {
        if (!this.pendingTypeChoice) return;
        this.pendingTypeChoice = null;
        this.hideTypeChoiceButtons();
        this.checkTurnState();
    }

    choosePlayType(declaredType) {
        if (!this.pendingTypeChoice) return;
        const indices = this.pendingTypeChoice;
        this.pendingTypeChoice = null;
        this.hideTypeChoiceButtons();

        const myHand = this.engine.players[this.myPlayerId].hand;
        const selectedCards = indices.map(idx => myHand[idx]);
        const check = this.engine.canPlayCards(selectedCards, declaredType);
        if (!check.valid) {
            this.turnText.setText(check.reason).setColor('#f44336');
            this.checkTurnState();
            return;
        }

        // 型を決めた結果Jが偶数枚になる場合は、続けて最終的な強さ順（上／下）を選ばせる（本人の裁定2026-11-18）
        if (this.needsJBackChoice(selectedCards, declaredType)) {
            this.showJBackChoice(declaredType);
            return;
        }

        if (this.isHost) {
            this.executePlay(this.myPlayerId, indices, declaredType);
            this.syncGameState();
        } else {
            // N-02：カードID＋型宣言を送る
            this.conn.send({ type: 'ACTION_PLAY', playerIdx: this.myPlayerId, cardIds: selectedCards.map(c => c.id), declaredType: declaredType });
        }
        this.selectedIndices = [];
    }

    // Jバックの選択対象か（本人の裁定2026-11-18）：J（JKのJ固定を含む）が偶数枚（2枚以上）の複数出し。
    // JKだけの組み合わせは G-07 で 2（逆転時3）に固定されるため、ここでも J として数えられない。
    // あがり札のときは場が流れてバックが消えるので対象外（W-05）
    needsJBackChoice(selectedCards, declaredType = null) {
        if (!RULE_FLAGS.ELEVEN_BACK) return false;
        const myHand = this.engine.players[this.myPlayerId].hand;
        if (selectedCards.length >= myHand.length) return false;
        const info = this.engine.analyzePlayInContext(selectedCards, declaredType);
        if (!info) return false;
        const count = [...info.assignedNums.values()].filter(n => n === 11).length;
        return count >= 2 && count % 2 === 0;
    }

    showJBackChoice(declaredType) {
        this.pendingJBackChoice = { indices: [...this.selectedIndices], declaredType };
        this.turnText.setText('強さ順をどちらにしますか？').setColor('#ffeb3b');
        [this.playBtn, this.passBtn, this.dobonBtn].forEach(b => { b.setVisible(false); this.setButtonEnabled(b, false); });
        [this.jBackApplyBtn, this.jBackSkipBtn].forEach(b => { b.setVisible(true); this.setButtonEnabled(b, true); });
    }

    hideJBackButtons() {
        [this.jBackApplyBtn, this.jBackSkipBtn].forEach(b => { b.setVisible(false); this.setButtonEnabled(b, false); });
        [this.playBtn, this.passBtn, this.dobonBtn].forEach(b => b.setVisible(true));
    }

    // カードの選択を変えたらJバック選択は取り消す
    cancelJBackChoice() {
        if (!this.pendingJBackChoice) return;
        this.pendingJBackChoice = null;
        this.hideJBackButtons();
        this.checkTurnState();
    }

    chooseJBack(jBackChoice) {
        if (!this.pendingJBackChoice) return;
        const { indices, declaredType } = this.pendingJBackChoice;
        this.pendingJBackChoice = null;
        this.hideJBackButtons();

        const myHand = this.engine.players[this.myPlayerId].hand;
        const selectedCards = indices.map(idx => myHand[idx]);
        if (this.isHost) {
            this.executePlay(this.myPlayerId, indices, declaredType, jBackChoice);
            this.syncGameState();
        } else {
            // N-02：カードID＋型宣言＋Jバック選択を送る
            this.conn.send({ type: 'ACTION_PLAY', playerIdx: this.myPlayerId, cardIds: selectedCards.map(c => c.id), declaredType: declaredType, jBackChoice: jBackChoice });
        }
        this.selectedIndices = [];
    }

    executePlay(playerIdx, indices, declaredType = null, jBackChoice = null) {
        if (this.engine.gameState === 'GAME_OVER') return;

        const res = this.engine.playCards(playerIdx, indices, null, declaredType, jBackChoice);
        this.selectedIndices = [];

        if (res.isFourStop) this.showEffectCutin('🛡️ 4止め成功！(8切り阻止)', 0x4caf50);
        if (res.isEightGiri) this.showEffectCutin('✂️ 8切り発生！', 0xe53935);
        if (res.isRevolutionTriggered) this.showEffectCutin('🔥 革命発生！', 0xff5722);
        if (res.is11BackTriggered) this.showEffectCutin('🔄 11バック！', 0x2196f3);
        if (res.isQBomber) this.showEffectCutin('💣 Qボンバー発動！', 0x795548);
        if (res.is5Skip) this.showEffectCutin('⏭️ 5スキップ！', 0x00bcd4);
        if (res.is9Reverse) this.showEffectCutin('↩️ 9リバース！', 0x8bc34a);

        // あがり保留中（ドボン判定待ち）は場カードを控え、あがりが同期解決した場合は
        // 最初の描画から見せ時間に入る（表示のみ。エンジンの状態は変えない）
        if (this.engine.dobonPhase && this.engine.dobonPhase.pendingWin && this.engine.fieldCards.length > 0) {
            this._pendingWinFieldCards = [...this.engine.fieldCards];
            this._pendingWinPlayerIndex = this.engine.dobonPhase.playPlayerIndex;
        }
        this.checkWinReveal(res.playedCards, playerIdx);

        this.updateDisplay();

        if (res.isGameOver) {
            this.showResultPopup();
            return;
        }

        // 💥 ドボン判定フェーズ：あがり・8切りはフェーズ解決後の後処理でエンジンが確定させる
        if (this.engine.dobonPhase) {
            this.handleDobonPhase();
            return;
        }

        // 後処理（あがり・8切り・脱落）で手番まで確定した場合は、ここで手番を進めない
        const lr = this.engine.lastDobonResult;
        const turnSettled = !!lr && (lr.winProcessed || lr.eightGiriProcessed || lr.dropoutIndex >= 0);
        if (!res.isClearAndKeepTurn && !turnSettled) {
            this.engine.nextTurn();
        }
        this.checkTurnState();
    }

    // あがりの「見せ時間」を始める（表示専用）：場に出たカードを WIN_REVEAL_MS の間だけ
    // 描き続け、その間は入力と手番の進行を止める。エンジンの状態・同期データには触れない
    startWinReveal(cards) {
        if (!cards || cards.length === 0) return;
        if (this.winRevealCards) return; // 既に見せ時間中なら二重に始めない
        this.winRevealCards = [...cards];
        this.setButtonEnabled(this.playBtn, false);
        this.setButtonEnabled(this.passBtn, false);
        this.setButtonEnabled(this.dobonBtn, false);
        this.updateDisplay();
        this.time.delayedCall(WIN_REVEAL_MS, () => this.endWinReveal());
    }

    // 見せ時間の終了：場の表示をエンジンの状態に戻し、保留していた結果表示か手番の続きへ進む
    endWinReveal() {
        if (!this.winRevealCards) return;
        this.winRevealCards = null;
        this.updateDisplay();
        if (this._winResultPopupDeferred) {
            this._winResultPopupDeferred = false;
            this.showResultPopup();
            return;
        }
        this.checkTurnState();
    }

    // あがりが確定した直後なら見せ時間を始める。確定の判定はエンジンの lastDobonResult
    // （winProcessed）だけを見る。ドボンで上がりが取り消された場合（winProcessed でない）は始めない。
    // fallbackCards は同期解決時に呼び出し側が持っている「出したカード」。非同期解決時は
    // あがり保留中に控えた場カードを使う。winnerIndex は同期解決時の出した人（非同期解決時は
    // 保留中に控えた playPlayerIndex を使う）
    checkWinReveal(fallbackCards, winnerIndex = null) {
        const lr = this.engine.lastDobonResult;
        if (!lr || !lr.winProcessed || lr === this._winRevealHandledResult) return;
        this._winRevealHandledResult = lr;
        const cards = (fallbackCards && fallbackCards.length > 0) ? fallbackCards
            : (this._pendingWinFieldCards && this._pendingWinFieldCards.length > 0) ? this._pendingWinFieldCards
            : this.engine.fieldCards;
        // ホストは、この解決を運ぶ次の同期に表示専用のあがり情報を同梱する（同期解決では
        // フェーズも場カードもゲストに届かないため、ゲスト側の見せ時間の材料にする）
        if (this.isHost) {
            const wIdx = (typeof winnerIndex === 'number') ? winnerIndex
                : (typeof this._pendingWinPlayerIndex === 'number') ? this._pendingWinPlayerIndex : -1;
            this._winRevealSyncPending = { winnerIndex: wIdx, cards: [...cards] };
        }
        this.startWinReveal(cards);
    }

    // 💥 ドボン判定フェーズの進行役：エンジンの質問状態を読み、CPUにはポリシー回答（できれば必ず宣言・返し）、
    // 自分には専用の選択ボタンを出し、相手の回答はネットワーク経由で受け取る。フェーズ中はタイマーに依存しない
    handleDobonPhase() {
        // あがり保留中は場カードを控え（解決後の見せ時間で出すため）、フェーズが解決して
        // あがりが確定していたら、描画より先に見せ時間を始める
        if (this.engine.dobonPhase && this.engine.dobonPhase.pendingWin && this.engine.fieldCards.length > 0) {
            this._pendingWinFieldCards = [...this.engine.fieldCards];
            this._pendingWinPlayerIndex = this.engine.dobonPhase.playPlayerIndex;
        }
        this.checkWinReveal();

        this.updateDisplay();
        this.syncGameState();

        if (this.engine.gameState === 'GAME_OVER') {
            this.showResultPopup();
            return;
        }

        const q = this.engine.getDobonQuestion();

        if (!this.isHost && (!q || q.playerIndex !== this.myPlayerId)) {
            // ゲスト：フェーズの進行はホストだけが持つ（N-04）。自分への質問が届いていない間は
            // 「ドボン判定中…」を表示して次の同期を待つ（ローカルではフェーズを進めない）
            this.turnText.setText('ドボン判定中…').setColor('#81d4fa');
            this.setButtonEnabled(this.playBtn, false);
            this.setButtonEnabled(this.passBtn, false);
            this.setButtonEnabled(this.dobonBtn, false);
            return;
        }

        if (!q) {
            // フェーズ解決済み。後処理（S4）で手番まで確定していない場合だけ、ここで手番を確定させる（S5）。
            // フェーズが非同期に解決した場合（相手の回答・自分の回答・CPUの回答）は executePlay の続きが
            // 走らないため、この分岐が S5 の担当になる。確定したらゲストへ同期してから手番表示を更新する
            const lr = this.engine.lastDobonResult;
            const turnSettled = !!lr && (lr.winProcessed || lr.eightGiriProcessed || lr.dropoutIndex >= 0 || lr.fieldFlowed);
            if (!turnSettled && this.engine.gameState !== 'GAME_OVER') {
                this.engine.nextTurn();
            }
            this.updateDisplay();
            this.syncGameState();
            this.checkTurnState();
            return;
        }

        const asked = this.engine.players[q.playerIndex];

        if (this.isHost && (asked.isCpu || (q.playerIndex === this.myPlayerId && this.isAutoMode))) {
            this.turnText.setText('ドボン判定中…').setColor('#81d4fa');
            this.time.delayedCall(this.isFastMode ? 0 : 400, () => {
                const cur = this.engine.getDobonQuestion();
                if (!cur) { this.handleDobonPhase(); return; }
                if (cur.playerIndex !== q.playerIndex || cur.kind !== q.kind) { this.handleDobonPhase(); return; }
                const res = this.engine.answerDobon(q.playerIndex, true);
                if (res && res.dropoutIndex >= 0) this.showEffectCutin('💥 DOBON!', 0xff1744);
                this.handleDobonPhase();
            });
            return;
        }

        if (q.playerIndex === this.myPlayerId) {
            // 自分への質問：「出す／パス」と混ざらない専用の選択にする（O-01）
            this.setButtonEnabled(this.playBtn, false);
            if (q.kind === 'DECLARE') {
                this.turnText.setText('ドボン判定中… ドボンしますか？').setColor('#ffeb3b');
                this.dobonBtn.txt.setText('💥 ドボンする');
                this.passBtn.txt.setText('ドボンしない');
            } else {
                this.turnText.setText('ドボン判定中… 返しますか？').setColor('#ffeb3b');
                this.dobonBtn.txt.setText('💥 返す');
                this.passBtn.txt.setText('返さない');
            }
            this.setButtonEnabled(this.dobonBtn, true);
            this.setButtonEnabled(this.passBtn, true);
            return;
        }

        // 相手（ゲスト）の回答待ち：該当者かどうかによらず全員に同じ表示（O-06）。回答は ACTION_DOBON_ANSWER で受け取る
        this.turnText.setText('ドボン判定中…').setColor('#81d4fa');
        this.setButtonEnabled(this.playBtn, false);
        this.setButtonEnabled(this.passBtn, false);
        this.setButtonEnabled(this.dobonBtn, false);
    }

    // 自分へのドボン質問に回答する（ボタンからの入口）
    answerDobonAndContinue(yes) {
        const q = this.engine.getDobonQuestion();
        if (!q || q.playerIndex !== this.myPlayerId) return;

        if (this.isHost) {
            const res = this.engine.answerDobon(this.myPlayerId, yes);
            if (res && res.dropoutIndex >= 0) this.showEffectCutin('💥 DOBON!', 0xff1744);
            this.dobonBtn.txt.setText('💥 ドボン！');
            this.handleDobonPhase();
        } else {
            this.conn.send({ type: 'ACTION_DOBON_ANSWER', playerIdx: this.myPlayerId, yes: yes });
        }
    }

    animate3StageCardDraw(playerIdx, card, targetSortedIndex, callback) {
        if (this.isFastMode || playerIdx !== this.myPlayerId || !card) {
            if (callback) callback();
            return;
        }

        const startX = 480, startY = 180;
        const hoverX = 320, hoverY = 400;

        const cardWidth = 62, maxAreaWidth = 550;
        const myHand = this.engine.players[this.myPlayerId].hand;
        const totalCards = myHand.length;
        const spacing = Math.min(68, maxAreaWidth / totalCards);
        const finalStartX = 320 - ((totalCards - 1) * spacing) / 2;
        const finalTargetX = finalStartX + (targetSortedIndex * spacing);
        const finalTargetY = 520;

        const animCard = this.add.container(startX, startY).setDepth(250);
        const cardBg = this.add.rectangle(0, 0, cardWidth, 90, 0xb71c1c).setStrokeStyle(1.5, 0xffffff);
        const innerPattern = this.add.rectangle(0, 0, 48, 72, 0x880e4f);
        animCard.add([cardBg, innerPattern]);

        this.tweens.add({
            targets: animCard,
            x: hoverX,
            y: hoverY,
            duration: 350,
            ease: 'Cubic.easeOut',
            onComplete: () => {
                this.tweens.add({
                    targets: animCard,
                    scaleX: 0,
                    duration: 120,
                    onComplete: () => {
                        cardBg.setFillStyle(0xffffff).setStrokeStyle(1.5, 0x333333);
                        innerPattern.destroy();

                        let textColor = (card.suit === '♥' || card.suit === '♦') ? '#d32f2f' : '#111111';
                        let suitTop = this.add.text(-22, -38, card.isJoker ? 'JK' : card.suit, { fontSize: '13px', color: textColor, fontStyle: 'bold' });
                        let numCenter = this.add.text(0, -2, card.isJoker ? 'JOKER' : this.getLabel(card.num), { fontSize: '18px', color: textColor, fontStyle: 'bold' }).setOrigin(0.5);
                        let ptBottom = this.add.text(0, 28, `(${card.num}pt)`, { fontSize: '10px', color: '#666666' }).setOrigin(0.5);
                        animCard.add([suitTop, numCenter, ptBottom]);

                        this.tweens.add({
                            targets: animCard,
                            scaleX: 1,
                            duration: 120,
                            onComplete: () => {
                                this.tweens.add({
                                    targets: animCard,
                                    x: finalTargetX,
                                    y: finalTargetY,
                                    duration: 350,
                                    ease: 'Quad.easeInOut',
                                    onComplete: () => {
                                        animCard.destroy();
                                        if (callback) callback();
                                    }
                                });
                            }
                        });
                    }
                });
            }
        });
    }

    onPlayerPassOrCancel() {
        if (this.winRevealCards) return; // あがりの見せ時間中は入力を受けない

        if (this.selectedIndices.length > 0) {
            this.selectedIndices = [];
            this.updateDisplay();
            return;
        }

        if (this.engine.gameState === 'START_CHOICE' || this.engine.gameState === 'GAME_OVER') return;

        // ドボン判定フェーズで自分が聞かれているときは、このボタンが「しない／返さない」の回答になる（O-01）
        const q = this.engine.getDobonQuestion();
        if (q && q.playerIndex === this.myPlayerId) {
            this.answerDobonAndContinue(false);
            return;
        }

        if (this.isHost) {
            // パスの処理（引く→引きドボン判定→場流れ判断）はエンジンの passTurn に一本化する
            this.engine.passTurn(this.myPlayerId);
            this.selectedIndices = [];
            this.updateDisplay();
            this.syncGameState();
            if (this.engine.gameState === 'GAME_OVER') {
                this.showResultPopup();
            } else if (this.engine.dobonPhase) {
                this.handleDobonPhase();
            } else {
                this.checkTurnState();
            }
        } else {
            this.conn.send({ type: 'ACTION_PASS', playerIdx: this.myPlayerId });
        }
    }

    checkTurnState() {
        // あがりの見せ時間中は、入力もCPUの手番進行も止める（終了時に endWinReveal から再開する）
        if (this.winRevealCards) {
            this.setButtonEnabled(this.playBtn, false);
            this.setButtonEnabled(this.passBtn, false);
            this.setButtonEnabled(this.dobonBtn, false);
            return;
        }

        if (this.engine.gameState === 'GAME_OVER') {
            this.showResultPopup();
            return;
        }

        // ドボン判定フェーズ中は、手番の確定よりフェーズの進行が優先する
        if (this.engine.dobonPhase) {
            this.handleDobonPhase();
            return;
        }

        const currentP = this.engine.players[this.engine.currentTurnIndex];
        this.updatePlayerHighlights();

        const isMyTurn = (this.engine.currentTurnIndex === this.myPlayerId);

        if (this.engine.gameState === 'START_CHOICE') {
            this.turnText.setText('【親決め】カードを1枚選択してください').setColor('#ffeb3b');
            this.setButtonEnabled(this.playBtn, true);
            this.setButtonEnabled(this.passBtn, false);

            if (this.isAutoMode && isMyTurn) {
                this.engine.selectStartCard(this.myPlayerId, 0);
                if (this.isHost) {
                    // onPlayerPlay と同じゲート：全員の選択がそろうまで確定しない
                    const allSelected = this.engine.players.every(pp => pp.startCard || pp.isCpu);
                    if (allSelected) {
                        this.engine.finalizeStartChoice();
                        this.updateDisplay();
                        this.syncGameState();
                        this.time.delayedCall(this.isFastMode ? 0 : 1000, () => this.checkTurnState());
                    }
                }
            }
            return;
        }

        if (isMyTurn && !this.isAutoMode) {
            this.turnText.setText('【あなたのターン】').setColor('#ffeb3b');
            this.setButtonEnabled(this.playBtn, true);
            this.setButtonEnabled(this.passBtn, true);
        } else {
            this.setButtonEnabled(this.playBtn, false);
            this.setButtonEnabled(this.passBtn, false);
            const title = (isMyTurn && this.isAutoMode) ? `${currentP.name} (AUTO)` : currentP.name;
            this.turnText.setText(`【${title} のターン】思考中...`).setColor('#81d4fa');

            const delay = this.isFastMode ? 0 : 700;

            if (this.isHost) {
                if (currentP.isCpu || (isMyTurn && this.isAutoMode)) {
                    this.time.delayedCall(delay, () => {
                        if (this.engine.gameState === 'GAME_OVER') return;
                        const indices = CpuPlayer.decidePlay(this.engine, currentP.id);
                        if (indices) {
                            this.executePlay(currentP.id, indices);
                        } else {
                            this.engine.passTurn(currentP.id);
                            this.updateDisplay();
                            if (this.engine.dobonPhase) {
                                this.handleDobonPhase();
                            } else {
                                this.checkTurnState();
                            }
                        }
                        this.syncGameState();
                    });
                }
            }
        }
    }

    updatePlayerHighlights() {
        this.playerBoxes.forEach((item, idx) => {
            const p = this.engine.players[idx];
            if (!p) {
                // 2人戦では3・4人目の枠は使わない
                item.box.setVisible(false);
                item.txt.setVisible(false);
                return;
            }
            item.box.setVisible(true);
            item.txt.setVisible(true);
            const isTurn = (idx === this.engine.currentTurnIndex);
            item.box.setStrokeStyle(isTurn ? 3 : 1, isTurn ? 0xffeb3b : 0x888888);
            item.txt.setColor(isTurn ? '#ffeb3b' : '#ffffff');
            
            if (p.isEliminated) {
                item.txt.setText(`${p.name}\n(${p.rank}位脱落)`);
            } else {
                item.txt.setText(`${p.name}\n手札:${p.hand.length}枚 | ${p.score}pt`);
            }
        });
    }

    updateDisplay() {
        const myHand = this.engine.players[this.myPlayerId].hand;
        const handTotal = GodaiEngine.getHandTotal(myHand);
        const winLimitLabel = RULE_FLAGS.USE_WIN_LIMIT ? `${RULE_FLAGS.TARGET_SCORE}回あがり終了` : 'ドボン縛り';
        this.totalText.setText(`手札合計: ${handTotal} 点 (${myHand.length}枚) | あがりpt: ${this.engine.players[this.myPlayerId].score}pt [${winLimitLabel}]`);

        const isRev = this.engine.isReverse();
        this.bgRect.setFillStyle(isRev ? 0x221133 : 0x143810);

        let modeStr = [];
        if (this.engine.isRevolution) modeStr.push('🔥 革命中');
        if (this.engine.is11Back) modeStr.push('🔄 11バック中');
        if (this.engine.shibariSuit) modeStr.push(`🔒 【${this.engine.shibariSuit}】縛り中`);
        if (this.engine.turnDirection === -1) modeStr.push('↩️ 逆回り');
        const modeText = modeStr.length > 0 ? modeStr.join(' / ') : '通常モード';
        this.ruleStateText.setText(`${modeText} | 山札: ${this.engine.deck.length} 枚 (捨て札: ${this.engine.discardPile.length} 枚)`);

        this.renderDeckVisual();
        this.renderFieldCardsVisual();

        // ドボンボタンは、フェーズで自分が聞かれているときだけ有効（ゲスト時は宣言可能な場面で有効）
        const dq = this.engine.getDobonQuestion();
        const canDobonNow = dq ? (dq.playerIndex === this.myPlayerId) : (!this.isHost && this.engine.canDeclareDobon(this.myPlayerId));
        this.setButtonEnabled(this.dobonBtn, !!canDobonNow);

        if (this.selectedIndices.length > 0) {
            this.passBtn.txt.setText('選択キャンセル');
            this.passBtn.color = 0x9e9e9e;
        } else {
            this.passBtn.txt.setText(this.engine.fieldCards.length === 0 ? '山札から引く' : '1枚引いてパス');
            this.passBtn.color = 0xff9800;
        }
        this.setButtonEnabled(this.passBtn, this.passBtn.enabled);

        this.renderHandCards();
        this.renderOpponentHands();
        this.updatePlayerHighlights();
    }

    renderFieldCardsVisual() {
        this.fieldCardContainers.forEach(c => c.destroy());
        this.fieldCardContainers = [];

        // あがりの見せ時間中は、エンジン側で場が流れていても、確定した上がり札を描き続ける
        const cards = (this.winRevealCards && this.winRevealCards.length > 0) ? this.winRevealCards : this.engine.fieldCards;
        if (cards.length === 0) return;

        const total = cards.length;
        const spacing = 32;
        const startX = 320 - ((total - 1) * spacing) / 2;
        const y = 180;

        cards.forEach((card, idx) => {
            const x = startX + idx * spacing;
            const container = this.add.container(x, y).setDepth(100);

            const cardBg = this.add.rectangle(0, 0, 48, 68, 0xffffff).setStrokeStyle(1.5, 0x333333);
            let textColor = (card.suit === '♥' || card.suit === '♦') ? '#d32f2f' : '#111111';

            let suitText = this.add.text(-18, -28, card.isJoker ? 'JK' : card.suit, { fontSize: '11px', color: textColor, fontStyle: 'bold' });
            let numText = this.add.text(0, -2, card.isJoker ? 'JOKER' : this.getLabel(card.num), { fontSize: '15px', color: textColor, fontStyle: 'bold' }).setOrigin(0.5);

            container.add([cardBg, suitText, numText]);
            this.fieldCardContainers.push(container);
        });
    }

    renderOpponentHands() {
        [1, 2, 3].forEach(pIdx => {
            if (this.opponentHandContainers[pIdx]) {
                this.opponentHandContainers[pIdx].destroy();
                this.opponentHandContainers[pIdx] = null;
            }
            if (!this.engine.players[pIdx]) return; // 2人戦では存在しないプレイヤーは描かない

            const cont = this.add.container(0, 0);
            const handLen = this.engine.players[pIdx].hand.length;
            if (handLen === 0) return;

            const isHoriz = (pIdx === 2);
            const basePos = pIdx === 1 ? { x: 100, y: 120 } : (pIdx === 2 ? { x: 320, y: 15 } : { x: 540, y: 120 });
            
            for (let i = 0; i < handLen; i++) {
                const offset = (i - (handLen - 1) / 2) * 12;
                const cx = isHoriz ? basePos.x + offset : basePos.x;
                const cy = isHoriz ? basePos.y : basePos.y + offset;

                const cardBg = this.add.rectangle(cx, cy, 26, 36, 0xb71c1c).setStrokeStyle(1, 0xffffff);
                const innerPattern = this.add.rectangle(cx, cy, 20, 30, 0x880e4f);
                cont.add([cardBg, innerPattern]);
            }
            this.opponentHandContainers[pIdx] = cont;
        });
    }

    createResultPopup() {
        this.resultPopup = this.add.container(320, 250).setVisible(false).setDepth(200);
        const popupBg = this.add.rectangle(0, 0, 420, 320, 0x000000, 0.95).setStrokeStyle(4, 0xffd700);
        const titleText = this.add.text(0, -120, '🏆 最終結果リザルト 🏆', { fontSize: '22px', color: '#ffd700', fontStyle: 'bold' }).setOrigin(0.5);

        this.resultText = this.add.text(0, -30, '', { fontSize: '15px', color: '#ffffff', align: 'center', lineSpacing: 10 }).setOrigin(0.5);

        const restartBtn = this.createButton(0, 110, '🔄 もう一度遊ぶ', 0x4caf50, () => { location.reload(); }, 160, 40);

        this.resultPopup.add([popupBg, titleText, this.resultText, restartBtn]);
    }

    showResultPopup() {
        // あがりの見せ時間中は結果表示を保留し、見せ時間の終了時に出す
        if (this.winRevealCards) {
            this._winResultPopupDeferred = true;
            return;
        }

        this.setButtonEnabled(this.playBtn, false);
        this.setButtonEnabled(this.passBtn, false);
        this.setButtonEnabled(this.dobonBtn, false);

        const sorted = [...this.engine.players].sort((a, b) => a.rank - b.rank);
        const lines = sorted.map(p => {
            const status = p.isEliminated ? ' (ドボン脱落)' : ' (生存)';
            return `${p.rank}位 : ${p.name}  [${p.score} pt]${status}`;
        });

        this.resultText.setText(lines.join('\n'));
        this.resultPopup.setVisible(true);
    }

    createButton(x, y, text, color, onClick, width = 120, height = 36) {
        const btnContainer = this.add.container(x, y);
        const bg = this.add.rectangle(0, 0, width, height, color, 1).setInteractive({ useHandCursor: true });
        const txt = this.add.text(0, 0, text, { fontSize: '13px', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);

        btnContainer.add([bg, txt]);
        bg.on('pointerdown', () => { if (btnContainer.enabled) onClick(); });

        btnContainer.color = color;
        btnContainer.bg = bg;
        btnContainer.txt = txt;
        btnContainer.enabled = true;
        return btnContainer;
    }

    setButtonEnabled(btnContainer, enabled) {
        btnContainer.enabled = enabled;
        btnContainer.bg.setFillStyle(enabled ? btnContainer.color : 0x555555, enabled ? 1 : 0.6);
        btnContainer.txt.setAlpha(enabled ? 1.0 : 0.5);
    }

    // 選択への追加可否（外部レビュー修正1、2026-11-16）：最終判定（canPlayCards）は緩めず、
    // 「選択中＋このカード」が手札の残りで出せる組み合わせに完成しうるかで決める。
    // 場がペア／階段でも1枚目から選んで組み立てられるようにするため。完成しえないカードは選べないまま
    canAddToSelection(card) {
        const myHand = this.engine.players[this.myPlayerId].hand;
        const selected = this.selectedIndices.map(i => myHand[i]);
        if (selected.includes(card)) return true;
        const base = [...selected, card];
        if (this.engine.canPlayCards(base).valid) return true;

        const rest = myHand.filter(c => !base.includes(c));
        const reals = base.filter(c => !c.isJoker);

        // 同じ数字の組み合わせへの完成：残りの同数字・JKを足した各枚数を試す
        const trySame = (numOrNull) => {
            const extras = rest.filter(c => c.isJoker || (numOrNull !== null && c.num === numOrNull));
            const variants = [extras, [...extras.filter(c => !c.isJoker), ...extras.filter(c => c.isJoker)]];
            for (const ex of variants) {
                for (let k = 1; k <= ex.length; k++) {
                    if (this.engine.canPlayCards([...base, ...ex.slice(0, k)]).valid) return true;
                }
            }
            return false;
        };
        if (reals.length === 0) {
            // JKだけの選択：JKのみの組でも、実カードを足した同数字の組でも完成しうる
            if (trySame(null)) return true;
            const nums = [...new Set(rest.filter(c => !c.isJoker).map(c => c.num))];
            for (const n of nums) { if (trySame(n)) return true; }
        } else if (reals.every(c => c.num === reals[0].num)) {
            if (trySame(reals[0].num)) return true;
        }

        // 階段への完成：実カードが同じスートで数字が重ならなければ、不足分を残りの手札・JKで埋めた候補を試す
        const toIdx = (num) => num === 1 ? 11 : (num === 2 ? 12 : num - 3);
        const fromIdx = (idx) => idx === 11 ? 1 : (idx === 12 ? 2 : idx + 3);
        const basePositions = reals.map(c => toIdx(c.num));
        if (new Set(basePositions).size === basePositions.length
            && (reals.length === 0 || new Set(reals.map(c => c.suit)).size === 1)) {
            const suitOptions = reals.length === 0 ? ['♠', '♥', '♦', '♣'] : [reals[0].suit];
            for (const suit of suitOptions) {
                for (let len = Math.max(3, base.length); len <= 13; len++) {
                    for (let start = 0; start + len - 1 <= 12; start++) {
                        const end = start + len - 1;
                        if (!basePositions.every(p => p >= start && p <= end)) continue;
                        const uncovered = [];
                        for (let i = start; i <= end; i++) if (!basePositions.includes(i)) uncovered.push(fromIdx(i));
                        // base 内のJKが埋める分を差し引いた、残りから必要な枚数
                        const needFromRest = uncovered.length - (base.length - reals.length);
                        if (needFromRest <= 0) continue;
                        const pool = [...rest];
                        const fillers = [];
                        let ok = true;
                        for (const numNeeded of uncovered) {
                            if (fillers.length >= needFromRest) break;
                            let ix = pool.findIndex(c => !c.isJoker && c.suit === suit && c.num === numNeeded);
                            if (ix < 0) ix = pool.findIndex(c => c.isJoker);
                            if (ix < 0) { ok = false; break; }
                            fillers.push(pool.splice(ix, 1)[0]);
                        }
                        if (ok && fillers.length === needFromRest && this.engine.canPlayCards([...base, ...fillers]).valid) return true;
                    }
                }
            }
        }
        return false;
    }

    renderHandCards() {
        this.handContainers.forEach(c => c.destroy());
        this.handContainers = [];

        const myHand = this.engine.players[this.myPlayerId].hand;
        const totalCards = myHand.length;
        if (totalCards === 0) return;

        const maxAreaWidth = 550;
        const cardWidth = 62;
        const spacing = Math.min(68, maxAreaWidth / totalCards);
        const startX = 320 - ((totalCards - 1) * spacing) / 2;
        const y = 520;

        const isMyTurn = (this.engine.currentTurnIndex === this.myPlayerId);

        myHand.forEach((card, index) => {
            const x = startX + (index * spacing);
            const isSelected = this.selectedIndices.includes(index);

            let isPlayable = true;
            if (isMyTurn && this.engine.gameState === 'PLAYING') {
                // 選択可否は「完成しうるか」で判定する（修正1）。選択済みのカードは解除できるよう常に可
                isPlayable = isSelected || this.canAddToSelection(card);
            }

            const container = this.add.container(x, isSelected ? y - 20 : y);
            const cardBgColor = isPlayable ? 0xffffff : 0xdddddd;
            
            const bg = this.add.rectangle(0, 0, cardWidth, 90, cardBgColor)
                .setStrokeStyle(isSelected ? 3 : 1, isSelected ? 0xffeb3b : 0x333333)
                .setInteractive({ useHandCursor: isPlayable });

            if (!isPlayable) container.setAlpha(0.65);

            let textColor = (card.suit === '♥' || card.suit === '♦') ? '#d32f2f' : '#111111';
            
            let suitTop = this.add.text(-22, -38, card.isJoker ? 'JK' : card.suit, { fontSize: '13px', color: textColor, fontStyle: 'bold' });
            let numCenter = this.add.text(0, -2, card.isJoker ? 'JOKER' : this.getLabel(card.num), { fontSize: '18px', color: textColor, fontStyle: 'bold' }).setOrigin(0.5);
            let ptBottom = this.add.text(0, 28, `(${card.num}pt)`, { fontSize: '10px', color: '#666666' }).setOrigin(0.5);

            container.add([bg, suitTop, numCenter, ptBottom]);
            this.handContainers.push(container);

            bg.on('pointerdown', () => {
                if (this.pendingTypeChoice) this.cancelTypeChoice();
                if (this.pendingJBackChoice) this.cancelJBackChoice();
                if (!isPlayable && !isSelected) return;

                if (isSelected) {
                    this.selectedIndices = this.selectedIndices.filter(i => i !== index);
                } else {
                    this.selectedIndices.push(index);
                }
                this.updateDisplay();
            });
        });
    }

    getLabel(num) {
        if (num === 1) return 'A';
        if (num === 11) return 'J';
        if (num === 12) return 'Q';
        if (num === 13) return 'K';
        return num.toString();
    }
}

const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    backgroundColor: '#0d230a',
    dom: { createContainer: true },
    // スマホ対応（2026-11-17）: Scale Manager で 900×650 のステージを画面に収まるよう
    // 自動縮小する。ゲーム内座標（900×650）は従来どおり不変。
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 900,
        height: 650
    },
    scene: [MainScene]
};

const game = new Phaser.Game(config);
</script>
